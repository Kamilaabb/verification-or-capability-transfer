purpose: >-
  The second math dataset of the GV vs max(G, V) study, run for one pre-chosen pair only
  (Ministral-8B / Qwen3-8B; docs/plan/olympiadbench_extension.md). Harder and differently
  sourced than MATH, it asks whether the MATH findings are specific to MATH. Nothing is fit,
  tuned or chosen on it.

