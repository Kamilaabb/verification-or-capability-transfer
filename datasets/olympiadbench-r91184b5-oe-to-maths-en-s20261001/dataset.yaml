  config: OE_TO_maths_en_COMP
  revision: 91184b52131e7fc9455fef848035173aea8cc01a
  splits_used: [train]
  total_rows: 674
  composition: >-
    English, text-only, open-ended competition maths problems (OlympiadBench's OE_TO_maths_en_COMP
    subset; every row checked to be Text-only, English and Open-ended). Each row has one
    final_answer string; about a third carry $...$ delimiters, which the loader strips
    (run_mathfull_solo.olympiad_gold) because math_parse_gold adds its own.
  license_note: the source card declares apache-2.0.

selection:
  exclusions_decided_from_source_only: true
  exclusion_rules:
    multiple_answer: is_multiple_answer is true; the frozen prompts ask for one boxed answer
    has_unit: the reference answer carries a unit, which the grader does not compare
    source_error_flag: the source marks the row with an error note
    duplicate_id: an id that occurs more than once; every copy is dropped (none found)
    duplicate_problem_text: exact question text that occurs more than once; every copy is dropped (none found)
    empty_answer: no reference answer (none found)
    gold_unparseable: run_c002_dev30.math_parse_gold cannot parse the reference answer
    gold_nonfinite: it parses to zoo or nan (the mathfull ungradeable-gold rule, applied up front; none found)
