    design_pairs:
      - {models: [Qwen3-4B, Qwen3-8B], cell: strong-strong, headroom: high}
      - {models: [Qwen3-8B, Qwen3-32B], cell: strong-strong, headroom: low}
      - {models: [Mistral-Small-24B-Instruct-2501, Qwen3-4B], cell: strong-middle, headroom: high}
      - {models: [Qwen2.5-3B-Instruct, Qwen3-32B], cell: strong-middle, headroom: low}
