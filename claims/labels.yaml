# Labels for the results database (docs/plan/results_db_and_claims.md).
# Everything here is copied from the plan documents cited per domain; nothing is recomputed.
# Models are named by the last segment of their Hugging Face id.
schema_version: results-labels-v1

# (dataset_id, manifest) -> domain and split. Archives on any other manifest are ignored.
# solo_table: false keeps an archive available as a direction's own G/V source but out of the
# per-split solo table (math "test" is the whole 2,500-row pool of c040-c043, which overlaps both splits).
# restrict_to: keep only problem ids present in that split's solo table.
manifests:
  - {dataset: mathfull-r465bcdb-l3to5-s20260924, manifest: testpool_dev1000, domain: math, split: dev}
  - {dataset: mathfull-r465bcdb-l3to5-s20260924, manifest: test1500, domain: math, split: test}
  - {dataset: mathfull-r465bcdb-l3to5-s20260924, manifest: test, domain: math, split: test,
     solo_table: false, restrict_to: test}
  - {dataset: mmlupro-rb189ec7-s20260927, manifest: dev1000, domain: knowledge, split: dev}
  - {dataset: mmlupro-rb189ec7-s20260927, manifest: test1500, domain: knowledge, split: test}
  - {dataset: bigcodebench-b74c0d0-instruct-s20260917, manifest: development, domain: code, split: dev}  # the 832-row development manifest
  - {dataset: nlreason-gpqad-reclorval-foliov2-s20261001, manifest: eval, domain: nl_reasoning, split: dev}
  - {dataset: olympiadbench-r91184b5-oe-to-maths-en-s20261001, manifest: eval, domain: math_olympiad, split: dev}

# Known archives on a labelled dataset that are deliberately out of scope (counted, not flagged).
# manifest null = the archive records no manifest name.
out_of_scope:
  - {dataset: bigcodebench-b74c0d0-instruct-s20260917, manifest: gate0, reason: early Gate 0 pilot c009 (300 rows)}
  - {dataset: bigcodebench-b74c0d0-instruct-s20260917, manifest: null, reason: early Gate 0 pilots c005/c006}

# Stopped or replaced runs, never used.
exclude: [c113, c244, c279, c297]

# When two archives answer the same (domain, split, reviewer, generator), use the listed one.
# Math: the registered stratified directions of pairs/mathfull_testpool_dev1000.yaml (c258 replaces c244).
prefer: [c210, c211, c212, c213, c214, c215, c216, c217, c218, c219, c220, c221, c222, c223, c224, c225,
         c226, c227, c228, c229, c230, c231, c232, c233, c234, c235, c236, c237, c238, c239, c240, c241,
         c242, c243, c245, c246, c247, c258, c152, c153, c042, c043, c248, c249, c250, c251, c252, c253,
         c262, c263, c264, c265, c266, c267, c268, c269]

# Which split decides the within-pair stronger side (higher solo correct count).
stronger_from: {math: dev, knowledge: dev, code: dev, nl_reasoning: dev, math_olympiad: dev}

domains:
  math:  # docs/plan/testpool_dev1000.md section 8; pairs/mathfull_testpool_dev1000.yaml
    tiers:
      strong: [Qwen3-32B, Qwen3-8B, Qwen3-4B, Qwen2.5-72B-Instruct]
      middle: [Qwen2.5-7B-Instruct, Mistral-Small-24B-Instruct-2501, Qwen2.5-3B-Instruct]
