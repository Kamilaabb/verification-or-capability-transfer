[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-allocation"
version = "0.1.0"
description = "Executable contracts for the authority-allocation experiment"
requires-python = ">=3.10"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.31.0",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "PyYAML==6.0.3",
    "math-verify[antlr4_13_2]==0.9.0",
    "Pillow==12.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
