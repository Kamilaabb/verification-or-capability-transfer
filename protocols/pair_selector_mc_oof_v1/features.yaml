- 20260925
- 20260926
- 20260927
- 20260928
- 20260929
outer_folds: 5
inner_folds: 5
grids:
  l2:
    m__C:
    - 0.01
    - 0.1
    - 1
    - 10
  gbt:
    m__max_depth:
    - 2
    - 3
    m__learning_rate:
    - 0.05
    - 0.1
    m__max_iter:
    - 100
    - 300
hyperparameter_selection: inner training folds only; neg_log_loss
tie: V
preprocessing:
  l2: SimpleImputer(median,add_indicator=True); StandardScaler; LogisticRegression(max_iter=5000)
  gbt: native missing; HistGradientBoostingClassifier(seed)
forbidden_in_inference:
- problem_id
- gold
- grades
- u0
- official_parser
- run_metadata
