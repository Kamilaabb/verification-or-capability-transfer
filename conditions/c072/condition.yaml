schema_version: condition-overlay-v1
condition_id: c072
status: registered_pending_run
extends: conditions/c071/condition.yaml

overrides:
  schema_version: condition-v1
  condition_id: c072
  status: registered_pending_run
  purpose: qwen3_8b_reviewer_of_c070_mmlu_pro_dev1000_4096

  gate:
    scope_limit: >-
      GV for docs/plan/mmlu_pro_study.md: Qwen3-8B (c071's identity) reviews c070's
      Qwen3-4B outputs under the frozen review prompt, seeing the question, the options
      and the other model's full output as plain text. c071 with only the prompt, the source
      of the reviewed outputs, record schemas, delivery, stages and seed cell changed.
      Delivery: the reviewer's letter, the reviewed model's letter when the reviewer's is
      unparseable (primary); reviewer unparseable counts as wrong (strict). Development only;
      the sealed test manifest is not touched.

  protocol:
    record_schemas:
      review: protocols/text_mc_v1/schemas/mc_review_record_v1.json
      generator_source: protocols/text_mc_v1/schemas/mc_record_v1.json
      native_logit_trace: protocols/router_v1/schemas/native_logit_trace_record_v1.json
      scalar_evidence: protocols/text_mc_v1/schemas/mc_evidence_record_v1.json

  generator_source:
    condition_id: c070
    artifact_path: /path/to/project/artifacts/20260926T211413Z__c070__mmlupro-dev1000__r014_solve4096
    pass1_run_id: 20260926T211413Z__c070__mmlupro-dev1000__r014_solve4096__pass1__p01
    model_id: Qwen/Qwen3-4B
    reuse_records_byte_for_byte: true

  model:
    prompt_pass1: conditions/c072/prompts/mc_review_v1.txt
    prompt_pass1_provenance: user_approved_mmlu_pro_review_prompt_v1_frozen_2026-09-26
    prompt_inputs: [question, options, y0]

  delivery:
    primary: the reviewer's registered answer letter; the reviewed model's letter when the reviewer's is unparseable
    strict: the reviewer's letter; reviewer unparseable counts as wrong
    report_fallback_rows: true

  replicates:
    seed_cell_id: c072

  stages:
    run: [reuse_c070_outputs, review_with_same_forward_logit_capture, scalar_evidence, grade, analyze]
    skip: [generate_g, controller_training]

  runnable_gate:
    required_before_submission:
      - c072 differs from c071 only in prompt, generator source, record schemas, delivery, stages, seed cell and text
      - the review prompt file's LF-normalized sha256 equals authority_allocation.mmlu_pro.FROZEN_PROMPTS
      - the c070 source archive passes its checksums, holds exactly 1000 record and native-trace rows, and its pass-1 run id equals generator_source.pass1_run_id
      - temperature is 0, thinking is false, max_new_tokens is 4096
      - local parser and record-schema tests pass
