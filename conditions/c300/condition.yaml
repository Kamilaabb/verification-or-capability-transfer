      domain applied to the code screen (user decision 2026-10-02): the middle/weak cell's largest-headroom pair
      Qwen2.5-7B x Qwen3-4B (headroom 79). Qwen2.5-7B (c104's identity) reviews c100's outputs on the
      832 development rows under the frozen code review prompt.
      c104 with only the prompt, the source of the reviewed outputs, record schemas, delivery, stages
      and seed cell changed; delivery as c110-c112. Development only; the test manifest is not read.

  protocol:
