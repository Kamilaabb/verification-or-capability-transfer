replicates:
  plan_id: r005
  path: replicates/r005.yaml
  seed_discontinuity_across_the_reused_prefix: see replicates/r005.yaml

reuse_policy:
  source_condition_id: c006
  source_condition_hash: a98b448c0d758cd942c1869615774368269eae95dbd4afef28d231388e3fbe48
  source_run_id: 20260918T105538Z__c006__gate0__r004__analysis__r004
  source_artifact_path: /path/to/project/artifacts/20260918T105538Z__c006__gate0__r004
  reuse_pattern: as c004 reused c003
  reuse_g_outputs: first_300_rows_only
  reuse_v_reports_and_token_traces: first_300_rows_only
  reuse_rewrites: false
  reuse_rewrites_because: gate_0_ran_no_rewrite_stage
  rerun_from: generate_for_rows_301_to_832
  rewrite_covers_all_832_rows_because: >-
    Gate 0 produced no u1 at all, so the reused prefix needs its rewrites as much as the
    new rows do. Rewrite still runs only where the registered request is not KEEP.
  reuse_is_row_exact_because: >-
    The dataset records that gate0 is the first 300 rows of development in the same
    shuffled order, so the prefix is identical by construction, not by matching.

stages:
  gate1:
    dataset_manifest: development
    registered_role: development
    purpose: complete_counterfactual_outcome_measurement
    may_tune_condition: true
    may_support_confirmatory_claims: false

preferred_runtime:
  partition: gpu-h100
  gpus: 1
  minimum_single_gpu_vram_gb: 40
  max_model_len: 32768
  grading_runs_on_cpu_partition: true
  grading_memory_minimum_gb: 48
  grading_memory_rationale: >-
    The child rlimit is looser than the cgroup at max_as_limit 30720, so too small a
    --mem makes the cgroup OOM killer fire first: grading stays correct but Slurm marks
    the job FAILED, and a FAILED job cannot be registered as validated.

job_split:
  required: true
  required_because: >-
    Priced by stage the work is about 10 hours against a 12-hour limit: 7.3 for verify on
    532 rows at the measured 49.4s each, 1.4 for their generate, and 1.3 for rewrite on
    about 499 rows at the measured 8.3s each. Fifteen percent headroom is not enough to
    stake a run on, and the dominant variance is the V fallback rate, which was 1/300 in
    c006 and would lengthen verify first if it rose. See docs/analysis/gate0_c006.md
    section 5.1.
  resume_is_not_a_scheduling_strategy: >-
    slurm/c006_gate0_inference.sbatch already resumes by key under a condition guard, but
    a job that reaches --time terminates as TIMEOUT, and a run whose jobs are not
    COMPLETED 0:0 cannot be registered validated. Resume is for crashes.
  jobs:
    - id: generate_verify
      stages: [generate, verify]
      rows: rows_301_to_832
      estimated_hours: 8.7
    - id: rewrite
      stages: [rewrite]
      rows: all_832_where_request_is_not_KEEP
      estimated_hours: 1.3
      depends_on: generate_verify
    - id: grade_analyze
      stages: [grade, analyze]
      partition: cpu
      depends_on: rewrite

successor_plan:
  gate2_condition: c008
  gate2_adds: [controller_evidence, controller]
  gate2_blocked_until: >-
    Gate 1 reports which of M0, M1 and M2 actually separate. A feature contract frozen
    before that is a guess about which cell is live.
  diagnostics_owed_before_gate_2:
    - token logprob exact alignment text_mismatch
    - retry usage aggregation
  diagnostics_owed_because: >-
    Both are inputs to a feature contract, and both must be settled without reading the
    test manifest. See docs/analysis/gate0_c006.md section 6.

hash_policy:
  algorithm: sha256
  canonicalization: canonical_json_of_resolved_behavior_config_v1
  include: [resolved_behavioral_condition_fields, referenced_prompt_bytes, protocol_component_hashes, immutable_model_revisions, chat_template_hashes, logprob_capture_mode]
  exclude: [status, purpose, preferred_runtime, node, gpu_uuid, slurm_job_id, timestamps, run_id]

change_policy:
  seed_change_creates_new_replicate_not_new_condition: true
  model_prompt_temperature_feature_or_algorithm_change_creates_new_condition: true
  completed_runs_are_immutable: true
