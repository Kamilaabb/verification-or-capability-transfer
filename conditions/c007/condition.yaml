schema_version: condition-v1
condition_id: c007
status: frozen_validated_gate_1
purpose: gate_1_add_rewrite_over_the_full_development_split_for_complete_z0_z1_z2
path_base: repository_root

gate:
  id: gate_1
  runs_stages: [generate, verify, rewrite, grade, analyze]
  skips_stages: [controller_evidence, controller]
  skips_stages_because: >-
    Gate 1 asks whether M0, M1 and M2 separate often enough, and in both directions, to
    be worth arbitrating. That is answered by counting outcomes, not by running a
    Controller. Which scalars a Controller should see depends on which cell turns out to
    be live, so a feature contract frozen now would be a guess. See
    conditions/c006/condition.yaml no_feature_contract_because, which said the same
    thing one gate earlier.
  measures:
    - all eight (z0, z1, z2) patterns with counts
    - z1 - z0 repair and harm event counts
    - z2 - z1 repair and harm event counts
    - acc_G, mean(u1), mean(u2) over the full 832
    - KEEP / CRITIQUE_REVISE / OVERRIDE distribution over the full 832
    - P(request != KEEP | u0 = 1) over the full 832, against the 300-row c006 value
  decision_criteria: protocols/authority_v6/README.md section 3
  primary_hypothesis_under_test: >-
    M1 and M2 differ on enough OVERRIDE rows, in both directions, to make the authority
    choice a real decision rather than a dominated one. c006 measured OVERRIDE at 21.3%,
    which extrapolates to about 177 rows out of 832; if the conditional divergence is as
    rare as c003's 19/72 the count is roughly 47, and reporting non-identifiability is a
    permitted outcome.
  unidentifiability_is_a_result_not_a_failure: >-
    protocols/authority_v6/README.md section 3 requires reporting sparse counterfactual
    difference as such. Repeated retuning to manufacture separation is forbidden.

protocol:
  id: authority_v6
  path: protocols/authority_v6/README.md
  grader_contract: protocols/authority_v6/grader_bigcodebench_v1.yaml
  record_schemas:
    generator_reused: protocols/authority_v6/schemas/g_record_single_v2.json
    verifier_reused: protocols/authority_v6/schemas/v_record_v2.json
    generator_new: protocols/authority_v6/schemas/g_record_single_v3.json
    verifier_new: protocols/authority_v6/schemas/v_record_v3.json
    rewrite_source: protocols/authority_v6/schemas/rewrite_record_v2.json
    grade_source: protocols/authority_v6/schemas/code_grade_record_v1.json
    counterfactual_source: protocols/authority_v6/schemas/counterfactual_record_v2.json
    run_manifest: protocols/authority_v5/schemas/run_manifest_v1.json
  two_record_generations_because: >-
    The 300 reused rows are c006's archive. They carry schema_version g-record-single-v2
    and v-record-v2, and the generator rows carry condition_id c005, because c006 reused
    c005's generator output verbatim. Completed runs are immutable, including the shape
    they were written in, so those rows stay under v2 and only the 532 new rows are v3.
    v3 is v2 with identity fields unpinned and g's parse_status extended to include
    deferred_to_grader, which the runner has written since c005.
  extraction_is_deferred_to_the_grader: >-
    No stage extracts a program. Whether one can be recovered is decided by the
    sanitizer that will execute it, inside the grading sandbox, for y0, y1 and y2 alike.
    rewrite_record_v2 therefore cannot report ok or model_invalid and reports
    deferred_to_grader instead.
  failure_fallback_ownership: >-
    protocols/authority_v5/README.md section 5 makes an unusable rewrite fall back to
    KEEP, so that branch scores u0 and keeps u1 null. Under deferred extraction the
    rewrite stage cannot see that failure. It records failure_fallback_action only for
    call_error, where no text exists at all; the unusable-program fallback is recorded by
    the grade stage, which is the first place it is visible. Neither stage may assume the
    other did it.

dataset:
  id: bigcodebench-b74c0d0-instruct-s20260917
  path: datasets/bigcodebench-b74c0d0-instruct-s20260917/dataset.yaml
  manifest: development
  manifest_rows: 832
  manifest_sha256: 5fc23a137b20357ca254f4a73fc9d72d4bca24adb05ca03b947a92d4917b4a30
  gate0_is_the_first_300_rows_in_the_same_order: true
  test_manifest_stays_unread: true

generator:
  role_id: G
  kind: llm
  model_id: Qwen/Qwen2.5-Coder-7B-Instruct
  revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
  server_path: /path/to/scratch/authority-allocation/models/Qwen--Qwen2.5-Coder-7B-Instruct/c03e6d358207e414f1eca0bb1891e29f1db0e242
  backend: vllm_openai
  backend_version: 0.29.0
  dtype: bfloat16
  quantization: none
  chat_template_hash: cd8e9439f0570856fd70470bf8889ebd8b5d1107207f67a5efb46e342330527f
  chat_template_hash_basis: tokenizer_config.chat_template_utf8
  chat_template_shared_with: Qwen/Qwen2.5-7B-Instruct
  thinking: false
  prompt_initial: conditions/c005/prompts/g_initial_v1.txt
  prompt_initial_provenance: byte_identical_to_c005_and_c006
  prompt_rewrite: conditions/c007/prompts/g_rewrite_v1.txt
  prompt_rewrite_provenance: new_in_this_condition
  prompt_rewrite_rationale: >-
    The only prior rewrite prompt is conditions/c002/prompts/g_rewrite_v1.txt, which ends
    "exactly one final answer in LaTeX boxed form". The port keeps c002's structure and
    adopts c005's g_initial output contract verbatim. Its one non-lossless substitution
    is c002's "do not assume that the verifier supplied a correct final answer", which
    has no referent here because the rewriter is never shown a candidate program; it now
    reads "do not assume that the critique is correct". See
    docs/plan/gate1_c007_design.md section 3.
  prompt_rewrite_probe: >-
    Job 65099276, twelve archived non-KEEP rows: 12/12 produced a program that compiles
    and defines the entry point, 11/12 differed from y0, zero length finishes, longest
    775 tokens. The probe rules out the case where the rewriter reproduces itself and
    Gate 1 has no events; at n=12 it estimates nothing finer.
  initial_decoding:
    samples: 1
    temperature: 0.0
    top_p: 1.0
    top_k: null
    max_new_tokens: 3072
    frequency_penalty: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    stop: model_eos_only
    y0_selection: sample_index_0_unconditionally
    output_logprobs:
      enabled: true
      mode: raw_logprobs
      sampled_token_logprob: true
      top_logprobs: 0
      return_token_ids: true
      require_exact_content_alignment: true
  rewrite_decoding:
    samples: 1
    temperature: 0.0
    top_p: 1.0
    top_k: null
    max_new_tokens: 3072
    max_new_tokens_rationale: >-
      Same cap as the initial call, so one model in one role does not carry two
      contracts. The probe's longest rewrite was 775 tokens with no length finishes, so
      the headroom is free: generation stops at EOS.
    frequency_penalty: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    stop: model_eos_only
    output_logprobs:
      enabled: false
      disabled_because: >-
        Rewrite output is post-action. No registered feature reads it, and the Controller
        is forbidden from seeing y1 at all (protocols/authority_v5/README.md section 6).
        Capturing a trace nothing may consume would only invite it to be consumed.

