schema_version: condition-v1
condition_id: c009
status: frozen_validated_gate0_gate1_stopped
purpose: gate_0_measure_seed_coder_against_the_frozen_qwen3_verifier
path_base: repository_root

gate:
  id: gate_0
  runs_stages: [generate, verify, grade, analyze]
  skips_stages: [rewrite, controller_evidence, controller]
  skips_stages_because: >-
    Gate 0 measures the deployed capability match, over-correction and error
    complementarity of the cross-family G/V pair. Rewrite and Controller behavior are
    downstream questions and cannot change this screen.
  measures:
    - acc_G = mean(u0)
    - mean(u2)
    - (u0, u2) cross table and error complementarity
    - KEEP / CRITIQUE_REVISE / OVERRIDE distribution
    - P(request != KEEP | u0 = 1)
    - P(request != KEEP | u0 = 0)
  incumbent_reference:
    condition_id: c006
    acc_G: 0.350
    mean_u2: 0.398
    error_complementarity: 0.100
    over_correction_rate: 0.438
  decision_criteria: >-
    Continue to Gate 1 if Seed-Coder remains capability-matched (acc_G between 0.35
    and 0.50), P(request != KEEP | u0 = 1) is at least 0.15, and deployed u0/u2 error
    complementarity exceeds c006's 0.100. The 200-row engineering probe's 0.186
    complementarity against archived u2 is a candidate-screening proxy, not the Gate 0
    target and not a result for this condition.
  primary_hypothesis_under_test: >-
    Replacing the same-family Qwen2.5-Coder generator with Seed-Coder increases
    generator/verifier error complementarity without introducing a capability mismatch.

