  purpose: qwen25_7b_solo_pass1_mathfull_dev1000_4096_solve_prompt_v2

  gate:
    scope_limit: >-
      Qwen2.5-7B-Instruct alone on mathfull dev1000 under the frozen solve prompt v2
      (docs/plan/gv_vs_max_g_v_study.md section 4.7), requested by the user. c025 with only
      the model changed: same prompt file, greedy decoding, 4096 tokens, same-forward native
      trace capture and seven-scalar contract. The chat template reads no clock and has no
      thinking switch; the registered system turn replaces its default "You are Qwen"
      system text, as rendered with the real tokenizer before registration. Its
      generation_config.json carries repetition_penalty 1.05, which vLLM would apply to any
      request that omits it; the request sends the registered 1.0. This is the snapshot
      c002/c003 served as G, whose requests omitted the penalty and so decoded with 1.05
      (docs/analysis/generation_config_decoding_defaults.md); c031 is not a rerun of them.
      Development only; the sealed test manifest is not touched.

  protocol:
    record_schemas:
      scalar_evidence: protocols/math_expression_scalar_v1/schemas/evidence_record_c031_v1.json

  # Every identity field equals conditions/c031/model_provenance.json, written from one scan
  # of the snapshot on the login node (2026-09-26); check-runnable enforces it.
  model:
    model_id: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28
    tokenizer_revision: a09a35458c702b33eeacc393d103063234e8bc28
    server_path: /path/to/scratch/authority-allocation/models/Qwen--Qwen2.5-7B-Instruct/a09a35458c702b33eeacc393d103063234e8bc28
    provenance: conditions/c031/model_provenance.json
