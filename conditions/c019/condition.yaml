    revision: b968826d9c46dd6066d109eabc6255188de91218
    tokenizer_revision: b968826d9c46dd6066d109eabc6255188de91218
    provenance: null
    identity_reused_from: c018
    identity_reuse_reason: >-
      Same frozen snapshot, server path and chat template as c018's verifier, whose
      300-row same-forward capture on this revision validated under job 65120313.
    server_path: /path/to/scratch/authority-allocation/models/Qwen--Qwen3-8B/b968826d9c46dd6066d109eabc6255188de91218
    chat_template_hash: a55ee1b1660128b7098723e0abcd92caa0788061051c62d51cbe87d9cf1974d8
    prompt_pass1_provenance: byte_identical_to_c017_g
    preflight_job: null
