  purpose: qwen3_8b_solo_pass1_math_dev300_without_seeing_g

  gate:
    scope_limit: >-
      c018's verifier is Qwen3-8B reading c017's G answer. c019 asks the same Qwen3-8B
      revision to solve the same 300 development problems on its own, with c017's G
      prompt, decoding and seven-scalar contract, and never shows it any G output. The
      only behavioral change from c017 is the model. It supports a paired
      both-correct / both-wrong / only-one-correct comparison of Qwen3-4B against
      Qwen3-8B solo, set beside c017 G against c018 V, which saw G. Development only;
      no confirmatory claim, no router, no Controller.

