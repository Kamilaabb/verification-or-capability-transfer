  condition_id: c112
  status: registered_pending_run
  purpose: qwen3_8b_reviewer_of_c100_qwen3_4b_bigcodebench_development832_4096

  gate:
    scope_limit: >-
      GV for docs/plan/code_bigcodebench_study.md section 10, the Qwen3-4B x Qwen3-8B pair that also
      ran in the math and knowledge domains (user request, 2026-09-27): Qwen3-8B (c101's identity) reviews
      c100's Qwen3-4B outputs on the 832 development rows under the frozen code review prompt.
      c101 with only the prompt, the source of the reviewed outputs, record schemas, delivery,
      stages and seed cell changed; delivery as c110/c111. Development only; the test manifest is not read.

  protocol:
    record_schemas:
      review: protocols/code_solve_v1/schemas/code_review_record_v1.json
      generator_source: protocols/code_solve_v1/schemas/code_record_v1.json
      native_logit_trace: protocols/router_v1/schemas/native_logit_trace_record_v1.json
      scalar_evidence: protocols/code_solve_v1/schemas/code_review_evidence_record_c112_c113_v1.json

  generator_source:
    condition_id: c100
    artifact_path: /path/to/project/artifacts/20260927T125345Z__c100__bcb-dev832__r015_solve4096
    pass1_run_id: 20260927T125345Z__c100__bcb-dev832__r015_solve4096__pass1__p01
    model_id: Qwen/Qwen3-4B
    reuse_records_byte_for_byte: true

  model:
    prompt_pass1: conditions/c110/prompts/code_review_v1.txt
    prompt_pass1_provenance: user_approved_code_review_prompt_v1_frozen_2026-09-27
    prompt_inputs: [problem, y0]

  delivery:
    primary: the reviewer's program; the reviewed model's program when the grader finds no program in the reviewer's output
    strict: the reviewer's program; reviewer model_invalid counts as wrong
    report_fallback_rows: true

  replicates:
    seed_cell_id: c112

  stages:
    run: [reuse_c100_outputs, review_with_same_forward_logit_capture, scalar_evidence, grade_in_evaluate_container, analyze]
    skip: [generate_g, controller_training]

  runnable_gate:
    required_before_submission:
      - c112 differs from c101 only in prompt, generator source, record schemas, delivery, stages, seed cell and text
      - the review prompt file's LF-normalized sha256 equals authority_allocation.bigcodebench_study.FROZEN_PROMPTS
      - the c100 source archive passes its checksums, holds exactly 832 record and native-trace rows, and its pass-1 run id equals generator_source.pass1_run_id
      - temperature is 0, thinking is false, max_new_tokens is 4096
      - local record-schema and runner tests pass
